[project]
name = "verdict"
version = "0.1.0"
description = "VERDICT — network-anomaly root-cause assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VERDICT" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "pydantic>=2",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "drain3",
    "numpy",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "networkx",
    "simpy",
    "openai",
    "tenacity",
    "jinja2",
    "faker",
    "python-dotenv",
    "matplotlib",
    "pytest",
    "jsonschema",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
